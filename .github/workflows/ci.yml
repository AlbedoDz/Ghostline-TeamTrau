name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Go tests
        run: go test ./...
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build
        run: wails3 build
